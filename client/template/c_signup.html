{% extends 'c_header.html'%}
{% block content %}
{% load static %}

<!-- breadcrumb-area -->
<script src="https://code.jquery.com/jquery-3.7.0.js" integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
    crossorigin="anonymous">
    </script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/parsley.js/2.9.2/parsley.js"></script>

<style>
    .parsley-errors-list {
        color: red;
    }
</style>
<script>
    $(document).ready(function() {
        // Prevent alphabet input in contact number field
        $('input[name="user_contact"]').on('keypress', function(e) {
            if (e.which < 48 || e.which > 57) {
                e.preventDefault();
            }
        });
    });
</script>
<div class="banner-area breadcrumb-area padding-top-120 padding-bottom-90">
    <div class="bread-shapes">
        <span class="b-shape-1 item-bounce"><img src="{% static 'assets/images/img/5.png' %}" alt=""></span>
        <span class="b-shape-2"><img src="{% static 'assets/images/img/6.png' %}" alt=""></span>
        <span class="b-shape-3"><img src="{% static 'assets/images/img/7.png' %}" alt=""></span>
        <span class="b-shape-4"><img src="{% static 'assets/images/img/9.png' %}" alt=""></span>
        <span class="b-shape-5"><img src="{% static 'assets/images/shapes/18.png' %}" alt=""></span>
        <span class="b-shape-6 item-animateOne"><img src="{% static 'assets/images/img/7.png' %}" alt=""></span>
    </div>
    <div class="container padding-top-120">
        <div class="row justify-content-center">
            <nav aria-label="breadcrumb">
                <h2 class="page-title">Signup Page</h2>

            </nav>
        </div>
    </div>
</div>

<!-- contact-form-area -->
<section class="about-area about-area2 writeto-us login-area signup-area padding-top-120 padding-bottom-120">
    <div class="form-shapes">
        <span class="fs1 item-animateOne"><img src="{% static 'assets/images/shapes/1.png' %}" alt=""></span>
        <span class="fs2 item-bounce"><img src="{% static 'assets/images/shapes/12.png' %}" alt=""></span>
        <span class="fs3"><img src="{% static 'assets/images/shapes/13.png' %}" alt=""></span>
        <span class="fs4 item-bounce"><img src="{% static 'assets/images/shapes/26.png' %}" alt=""></span>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-lg-6 col-md-12  wow fadeInUp">
                <div class="about-left">
                    <div class="about-l-shapes">
                        <span class="als-1"><img src="{% static 'assets/images/shapes/2.png' %}" alt=""></span>
                    </div>
                    <div class="row">
                        <div
                            class="col-lg-4 col-md-4 col-sm-4 col-4 d-flex align-items-end justify-content-end margin-bottom-20">
                            <div class="about-gallery-1">
                                <img src="/static/assets/images/recipeimage/veg1.jpg/" alt="">
                            </div>
                        </div>
                        <div class="col-lg-8 col-md-8 col-sm-8 col-8 margin-bottom-20">
                            <div class="about-gallery-2">
                                <img src="/static/assets/images/recipeimage/veg2.jpg/" style="height: 350px; width: 350px;" alt="">

                            </div>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-6 col-6">
                            <div class="about-gallery-3">
                                <img src="/static/assets/images/recipeimage/veg3.jpg/" alt="">
                            </div>
                        </div>
                        <div class="col-lg-5 col-md-5 col-sm-5 col-5 d-flex align-items-stretch ">
                            <div class="about-gallery-5 text-center">
                                <img src="/static/assets/images/recipeimage/veg4.jpg/" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-12 wow fadeInUp">
                <div class="contact-form-area login-form-area signup-form-area">
                    <h3>Signup <span>now</span></h3>
                    <form action="/client/c_signup/" method="post" data-parsley-validate>
                        {% csrf_token %}
                       
                        <label for="username">Name</label>
                        <input type="text" placeholder="name" name="user_name" required data-parsley-required-message="Name is required">
                        <label for="email">Email</label>
                        <input type="email" placeholder="email" name="email" required 
                            data-parsley-type="email" 
                            data-parsley-required-message="Email is required"
                            data-parsley-error-message="Enter a valid email (e.g. user@example.com)"> 
                        <label for="password">Password</label>
                        <input type="password" placeholder="password" name="password" required data-parsley-required-message="Password is required" 
                        data-parsley-minlength="8" 
                        data-parsley-minlength-message="Password must be at least 8 characters long">
                        <label for="contact">Contact number</label>
                        <input type="text" placeholder="Contact number" name="user_contact" required data-parsley-type="digits" data-parsley-required-message="Phone number is required" data-parsley-type-message="Please enter a valid phone number" data-parsley-length="[10,10]" data-parsley-length-message="Please enter exactly 10 digits"> 
                        <input type="hidden" value="0" name="is_admin"></input>
                        <!-- <input type="text" placeholder="Address" name="area_id"> -->
                        <label for="username">Address</label><br>
                        <select name="area_id" id="address" required data-parsley-required-message="address is required" class="form-control">
                            {% for data in area %}
                            <option value="{{data.area_id}}">{{data.area_address}}</option> 
                            {% endfor %}
                        </select>
                        <!-- <input type="password" placeholder="confirm password" > -->
                       
                        <div class="login-btn">
                            <button type="submit" class="btn">login account</button>
                            <span>already have an account? <a href="/client/c_login">login</a></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
