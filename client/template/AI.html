{% extends "c_header.html" %} {% block content %} {% load static %}

<!-- breadcrumb-area -->
<div class="banner-area breadcrumb-area padding-top-120 padding-bottom-90">
  <div class="bread-shapes">
    <span class="b-shape-1 item-bounce"
      ><img src="{% static 'assets/images/img/5.png' %}" alt=""
    /></span>
    <span class="b-shape-2"
      ><img src="{% static 'assets/images/img/6.png' %}" alt=""
    /></span>
    <span class="b-shape-3"
      ><img src="{% static 'assets/images/img/7.png' %}" alt=""
    /></span>
    <span class="b-shape-4"
      ><img src="{% static 'assets/images/img/9.png' %}" alt=""
    /></span>
    <span class="b-shape-5"
      ><img src="{% static 'assets/images/shapes/18.png' %}" alt=""
    /></span>
    <span class="b-shape-6 item-animateOne"
      ><img src="{% static 'assets/images/img/7.png' %}" alt=""
    /></span>
  </div>
  <div class="container padding-top-120">
    <div class="row justify-content-center">
      <nav aria-label="breadcrumb text-center">
        <h2 class="page-title">AI Search</h2>
      </nav>
    </div>
  </div>
</div>

<!-- AI Search and Image Upload area -->
<div class="error-area padding-top-120 padding-bottom-120">
  <div class="container d-flex align-items-center justify-content-center">
    <div class="signup-form-area">
      <form
        action="{% url 'upload_image' %}"
        method="post"
        enctype="multipart/form-data"
      >
        {% csrf_token %}
        <input
          class="wow fadeInUp"
          type="file"
          name="image"
          onchange="loadFile(event)"
          required
        />
        <br />
        <br />
        <img
          src=""
          name="output"
          id="output"
          style="
            margin-left: 2px;
            border-radius: 5px;
            height: 300px;
            width: 300px;
          "
        /><br /><br />
        <button type="submit" class="btn margin-top-40">Search With AI</button>
      </form>
      <script>
        function loadFile(event) {
          document.getElementById("output").src = URL.createObjectURL(
            event.target.files[0]
          );
        }
      </script>
      <br />
      <br />
      <div class="dish-content" style="width: 500px;">
        <p>{{text}}</p>
      </div>
      <br />
      <br />
      <br />
    </div>
  </div>
</div>

{% endblock %}
