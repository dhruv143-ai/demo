{% extends "c_header.html" %} {% block content %} {% load static %}
<script
      src="https://code.jquery.com/jquery-3.7.0.js"
      integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
      crossorigin="anonymous">
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/parsley.js/2.9.2/parsley.js"></script>

<style>
.parsley-errors-list {
    color: red;
}
</style>
<!-- breadcrumb-area -->
<div class="banner-area breadcrumb-area padding-top-120 padding-bottom-90">
  <div class="bread-shapes">
    <span class="b-shape-1 item-bounce"
      ><img src="{% static 'assets/images/img/5.png '%}" alt=""
    /></span>
    <span class="b-shape-2"
      ><img src="{% static 'assets/images/img/6.png '%}" alt=""
    /></span>
    <span class="b-shape-3"
      ><img src="{% static 'assets/images/img/7.png '%}" alt=""
    /></span>
    <span class="b-shape-4"
      ><img src="{% static 'assets/images/img/9.png '%}" alt=""
    /></span>
    <span class="b-shape-5"
      ><img src="{% static 'assets/images/shapes/18.png '%}" alt=""
    /></span>
    <span class="b-shape-6 item-animateOne"
      ><img src="{% static 'assets/images/img/7.png '%}" alt=""
    /></span>
  </div>
  <div class="container padding-top-120">
    <div class="row justify-content-center">
      <nav aria-label="breadcrumb">
        <h2 class="page-title"> Forgot Password </h2>
      </nav>
    </div>
  </div>
</div>

<!-- contact-form-area -->
<section
  class="about-area about-area2 writeto-us login-area padding-top-120 signup-area padding-bottom-60"
>
  <div class="form-shapes">
    <span class="fs1 item-animateOne"
      ><img src="{% static 'assets/images/shapes/1.png '%}" alt=""
    /></span>
    <span class="fs2 item-bounce"
      ><img src="{% static 'assets/images/shapes/12.png '%}" alt=""
    /></span>
    <span class="fs3"
      ><img src="{% static 'assets/images/shapes/13.png '%}" alt=""
    /></span>
    <span class="fs4 item-bounce"
      ><img src="{% static 'assets/images/shapes/26.png '%}" alt=""
    /></span>
  </div>
  <div class="container">
    <div class="row">
      <div class="col-lg-6 col-md-12 wow fadeInUp">
        <div class="about-left">
          <div class="about-l-shapes">
            <span class="als-1"
              ><img src="{% static 'assets/images/shapes/2.png '%}" alt=""
            /></span>
          </div>
          <div class="row">
            <div
              class="col-lg-4 col-md-4 col-sm-4 col-4 d-flex align-items-end justify-content-end margin-bottom-20"
            >
              <div class="about-gallery-1">
                <img src="/static/assets/images/recipeimage/forgot1.jpg/" alt="" />
              </div>
            </div>
            <div class="col-lg-8 col-md-8 col-sm-8 col-8 margin-bottom-20">
              <div class="about-gallery-2">
                <img src="/static/assets/images/recipeimage/forgot2.jpg/" alt="" />
              </div>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-6 col-6">
              <div class="about-gallery-3">
                <img src="/static/assets/images/recipeimage/forgot3.jpg/" style="width:300px; height:300px;" alt="" />
              </div>
            </div>
            <div
              class="col-lg-5 col-md-5 col-sm-5 col-5 d-flex align-items-stretch"
            >
              <div class="about-gallery-5 text-center">
                <img src="/static/assets/images/recipeimage/forgot4.jpg/" style="width:300px; height:320px;" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-12 wow fadeInUp">
        <div class="contact-form-area login-form-area signup-form-area">
          <!-- <h3>login to <span>your account</span></h3> -->
          <form action="/client/c_forgot/" method="post" data-parsley-validate>
            {% csrf_token %}
            <div>
              <label>Forgot Password</label><br><br>
              <input type="email" name="temail" placeholder="Enter email" required 
              data-parsley-type="email" 
              data-parsley-required-message="Email is required"
              data-parsley-error-message="Enter a valid email (e.g. user@example.com)">             </div>
            <div class="login-btn">
              <button type="submit" class="btn">Send email</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
