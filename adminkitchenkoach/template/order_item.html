{% extends 'header.html' %}
{% block content %}
		<!--start page wrapper -->
		<div class="page-wrapper">
			<div class="page-content">
				
				<h6 class="mb-0 text-uppercase">Order Item Table</h6>
				<hr/>
				<div class="card">
					<div class="card-body">
						<div class="table-responsive">
							<table id="example2" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th>ID</th>
										<th>Order_id</th>
										<th>Product Name</th>
                                        <th>Quantity</th>
                                        <th>Price</th>
									</tr>
								</thead>
								<tbody>
									{% for data in order_item %}
									<tr>	
										<td>{{data.order_item_id}}</td>
										<td>{{data.order_id}}</td>
										<td>{{data.product_id.product_name}}</td>
                                        <td>{{data.order_item_qty}}</td>
                                        <td>{{data.order_item_price}}</td>
									</tr>
									{% endfor %}
									
								</tbody>
								<tfoot>

								</tfoot>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--end page wrapper -->
{% endblock %}
