{% extends 'header.html' %}
{% block content %}
		<!--start page wrapper -->
		<div class="page-wrapper">
			<div class="page-content">
				
				<h6 class="mb-0 text-uppercase">Order Table</h6>
				<a href="//"></a>
				<hr/>
				<div class="card">
					<div class="card-body">
						<div class="table-responsive">
							<table id="example2" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th>Order ID</th>
										<th>Username</th>
										<th>Date</th>
                                        <th>Amount</th>
                                        <th>Payment Status</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									{% for data in order %}
									<tr>
										<td>{{data.order_id}}</td>
										<td>{{data.user_id.user_name}}</td>
										<td>{{data.order_date}}</td>
                                        <td>{{data.total_amt}}</td>
                                        <td>{{data.payment_status}}</td>
										
                                        <td><a href="/order_item_func/{{data.order_id}}">View Item</a></td>
									</tr>
									{% endfor %}
									
								</tbody>
								<tfoot>

								</tfoot>
							</table>
						</div>
					</div>	
				</div>
			</div>
		</div>
		<!--end page wrapper -->
{% endblock %}
