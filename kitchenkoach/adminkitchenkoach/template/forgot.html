<!DOCTYPE html>
<html lang="en">
{% load static %}

<!-- Mirrored from codervent.com/synadmin/demo/vertical/authentication-forgot-password.html by HTTrack Website Copier/3.x [XR&CO'2014], Sat, 05 Oct 2024 05:53:24 GMT -->
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!--favicon-->
	<link rel="icon" href="{% static 'assets/images/favicon-32x32.png'%}" type="image/png" />
	<!-- loader-->
	<link href="{% static 'assets/css/pace.min.css'%}" rel="stylesheet" />
	<script src="{% static 'assets/js/pace.min.js'%}"></script>
	<!-- Bootstrap CSS -->
	<link href="{% static 'assets/css/bootstrap.min.css'%}" rel="stylesheet">
	<link href="{% static 'assets/css/bootstrap-extended.css'%}" rel="stylesheet">
	<link href="{% static 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap'%}" rel="stylesheet">
	<link href="{% static 'assets/css/app.css'%}" rel="stylesheet">
	<link href="{% static 'assets/css/icons.css'%}" rel="stylesheet">
	<title>Synadmin – Bootstrap5 Admin Template</title>
</head>

<body>
	<!-- wrapper -->
	<div class="wrapper">
		<div class="authentication-header"></div>
		<div class="authentication-forgot d-flex align-items-center justify-content-center">
			<div class="card forgot-box rounded-4">
				<div class="card-body">
					<div class="p-4 rounded">
						<div class="text-center">
							<img src="{% static 'assets/images/icons/lock.png'%}" width="120" alt="" />
						</div>
						<h4 class="mt-5 font-weight-bold">Forgot Password?</h4>
						<p class="text-muted">Enter your registered email ID to reset the password</p>
                        <form method="POST" action="/forgot/" id="forgot-password-form">
                            {% csrf_token %}
                        
						<div class="my-4">
							<label class="form-label">Email id</label>
							<input type="text" name="temail" class="form-control form-control-lg" placeholder="example@user.com" />
						</div>

						<div class="d-grid gap-2">
							<button type="submit" class="btn btn-primary btn-lg">Send</button> <a href="/login/" class="btn btn-white btn-lg"><i class='bx bx-arrow-back me-1'></i>Back to Login</a>
						</div>
                    </form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- end wrapper -->
</body>


<!-- Mirrored from codervent.com/synadmin/demo/vertical/authentication-forgot-password.html by HTTrack Website Copier/3.x [XR&CO'2014], Sat, 05 Oct 2024 05:53:24 GMT -->
</html>
