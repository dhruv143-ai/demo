{% extends 'header.html' %}
{% block content %}
{% load static %}
		<!--start page wrapper -->
		<div class="page-wrapper">
			<div class="page-content">
				
				<h6 class="mb-0 text-uppercase">Area Table</h6>
				<h3 align="right"><a href="/insarea/">Insert</a></h3>
				<hr/>
				<div class="card">
					<div class="card-body">
						<div class="table-responsive">
							<table id="example2" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th>Area ID</th>
										<th>Address</th>
										<th>Pincode</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									{% for data in area %}
									<tr>
										<td>{{data.area_id}}</td>
										<td>{{data.area_address}}</td>
										<td>{{data.area_pincode}}</td>
										<td colspan="2">
											<a href="/delete_area/{{data.area_id}}">
												<img alt="delete logo" 
												src="{% static 'assets/trash.png' %}"
												type="image/png" width="20px" height="20px">
											</a>
											<a href="/updatearea/{{data.area_id}}">
												<img alt="update logo" 
												src="{% static 'assets/update.png' %}"
												type="image/png" width="20px" height="20px">
											</a>
									</tr>
									{% endfor %}
								
								</tbody>
								<tfoot>

								</tfoot>
							</table>
							
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--end page wrapper -->
{% endblock %}
