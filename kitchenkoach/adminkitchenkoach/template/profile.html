{% extends 'header.html' %} 
{% load static %} 
{% block content %}
<div class="page-wrapper">
			<div class="page-content">
				<!--breadcrumb-->
				<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
					<div class="breadcrumb-title pe-3">User Profile</div>
					<div class="ps-3">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb mb-0 p-0">
								<li class="breadcrumb-item"><a href="javascript:;"><i class="bx bx-home-alt"></i></a>
								</li>
								<li class="breadcrumb-item active" aria-current="page">User Profile</li>
							</ol>
						</nav>
					</div>
					
				</div>
				<!--end breadcrumb-->
				<div class="container">
					<div class="main-body">
						<div class="row">
							<div class="col-lg-4">
								<div class="card">
									<div class="card-body">
										<div class="d-flex flex-column align-items-center text-center">
											<img src="/static/assets/images/user_image/{{user.profile_pic}}" alt="Admin" class="rounded-circle p-1 bg-primary" width="110">
											<div class="mt-3">
												<h4>{{user.user_name}}</h4>
												<!-- <p class="text-secondary mb-1">Full Stack Developer</p>
												<p class="text-muted font-size-sm">Bay Area, San Francisco, CA</p> -->
											</div>
										</div>
										
									</div>
								</div>
							</div>
							
							<div class="col-lg-8">
								<form method="post">
									{% csrf_token %}
								<div class="card">
									<div class="card-body">
										<div class="row mb-3">
											<div class="col-sm-3">
												<h6 class="mb-0">Full Name</h6>
											</div>
											<div class="col-sm-9 text-secondary">
												<input type="text" value="{{user.user_name}}" class="form-control" name = "user_name" />
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-sm-3">
												<h6 class="mb-0">Email</h6>
											</div>
											<div class="col-sm-9 text-secondary">
												<input type="text" value="{{user.email}}" class="form-control" name="email" />
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-sm-3">
												<h6 class="mb-0">Mobile</h6>
											</div>
											<div class="col-sm-9 text-secondary">
												<input type="text" value="{{user.user_contact}}" class="form-control"  name="user_contact" />
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-sm-3">
												<h6 class="mb-0">Address</h6>
											</div>
											<div class="col-sm-9 text-secondary">
												<select id="address" name="area_id" class="form-control" required>
													<!-- <option selected disabled value="">{{user.area_id.area_address}}</option> -->
													{% for data in area %}
													<option value="{{data.area_id}}">{{data.area_address}}</option>
													{% endfor %}

												</select>
											</div>
										</div>
										<div class="row">
											<div class="col-sm-3"></div>
											<div class="col-sm-9 text-secondary">
												<input type="submit" class="btn btn-primary px-4" value="Save Changes" />
											</div>
                                            <div class="col-sm-9 text-secondary">
											</div>
										</div>
									</div>
								</div>
							</form>

							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--end page wrapper -->

{% endblock %}
