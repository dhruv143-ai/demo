{% extends 'header.html' %}
{% block content %}
		<!--start page wrapper -->
		<div class="page-wrapper">
			<div class="page-content">
				
				<h6 class="mb-0 text-uppercase">Notification Table</h6>
				<hr/>
				<div class="card">
					<div class="card-body">
						<div class="table-responsive">
							<table id="example2" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th>Notification ID</th>
										<th>Username</th>
										<th>Description</th>
                                        <th>Date</th>
									</tr>
								</thead>
								<tbody>
									{% for data in notification %}
									<tr>
										<td>{{data.notifi_id}}</td>
										<td>{{data.user_id.user_name}}</td>
										<td>{{data.notifi_desc}}</td>
                                        <td>{{data.notifi_date}}</td>
									</tr>
									{% endfor %}
									
								</tbody>
								<tfoot>

								</tfoot>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--end page wrapper -->
{% endblock %}
