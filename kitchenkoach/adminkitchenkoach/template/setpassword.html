<!DOCTYPE html>
<html lang="en">
{% load static %}

<!-- Mirrored from codervent.com/synadmin/demo/vertical/authentication-reset-password.html by HTTrack Website Copier/3.x [XR&CO'2014], Sat, 05 Oct 2024 05:53:24 GMT -->
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!--favicon-->
	<link rel="icon" href="{% static 'assets/images/favicon-32x32.png'%}" type="image/png" />
	<!-- loader-->
	<link href="{% static 'assets/css/pace.min.css'%}" rel="stylesheet" />
	<script src="{% static 'assets/js/pace.min.js'%}"></script>
	<!-- Bootstrap CSS -->
	<link href="{% static 'assets/css/bootstrap.min.css'%}" rel="stylesheet">
	<link href="{% static 'assets/css/bootstrap-extended.css'%}" rel="stylesheet">
	<link href="{% static 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap'%}" rel="stylesheet">
	<link href="{% static 'assets/css/app.css'%}" rel="stylesheet">
	<link href="{% static 'assets/css/icons.css'%}" rel="stylesheet">
	<title>Synadmin – Bootstrap5 Admin Template</title>
</head>

<body>
	<!-- wrapper -->
	<div class="wrapper">
		<div class="authentication-header"></div>
		 <div class="authentication-reset-password d-flex align-items-center justify-content-center">
			 <form method="post" action="/setpassword/">
				 {% csrf_token %}
			<div class="row">
				<div class="col-12 col-lg-10 mx-auto">
					<div class="card">
						<div class="row g-0">
							<div class="col-lg-5 border-end">
								<div class="card-body">
									<div class="p-5">
										<div class="text-start">
											<img src="{% static 'assets/images/logo-img.png'%}" width="180" alt="">
										</div>
										<h4 class="mt-5 font-weight-bold">Generate New Password</h4>
										<p class="text-muted">We received your reset password request. Please enter your new password!</p>
                                        
										<div class="mb-3 mt-5">

											<label class="form-label">OTP</label>
											<input type="text" name="otp" class="form-control" placeholder="Enter OTP" />

											<label class="form-label">New Password</label>
											<input type="text" name="pass" class="form-control" placeholder="Enter new password" />
										</div>
										<div class="mb-3">
											<label class="form-label">Confirm Password</label>
											<input type="text" name="cpass" class="form-control" placeholder="Confirm password" />
										</div>
										<div class="d-grid gap-2">
											<button type="submit" class="btn btn-primary">Change Password</button> <a href="/sign/" class="btn btn-light"><i class='bx bx-arrow-back mr-1'></i>Back to Login</a>
										</div>
									</div>
								</div>
							</div>
                        </form>
                        {% for data in messages %}
                        <span style="color:red">{{data}}</span>
                        {% endfor %}
							<div class="col-lg-7">
								<img src="{% static 'assets/images/login-images/forgot-password-frent-img.jpg'%}" class="card-img login-img h-100" alt="...">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- end wrapper -->
</body>


<!-- Mirrored from codervent.com/synadmin/demo/vertical/authentication-reset-password.html by HTTrack Website Copier/3.x [XR&CO'2014], Sat, 05 Oct 2024 05:53:25 GMT -->
</html>
