{% extends 'header.html' %}
{% load static %}
{% block content %}
<!--start page wrapper -->
<script src="https://code.jquery.com/jquery-3.7.0.js" integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
	crossorigin="anonymous">
	</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/parsley.js/2.9.2/parsley.js"></script>

<style>
	.parsley-errors-list {
		color: red;
	}
</style>
<div class="page-wrapper">
	<div class="page-content">
		<!--breadcrumb-->
		<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
			<div class="breadcrumb-title pe-3">Forms</div>
			<div class="ps-3">
				<nav aria-label="breadcrumb">

					<ol class="breadcrumb mb-0 p-0">
						<li class="breadcrumb-item"><a href="javascript:;"><i class="bx bx-home-alt"></i></a>
						</li>
						<li class="breadcrumb-item active" aria-current="page">Validations</li>
					</ol>
				</nav>
			</div>
			<div class="ms-auto">
				<div class="btn-group">
					<button type="button" class="btn btn-primary">Settings</button>
					<button type="button" class="btn btn-primary split-bg-primary dropdown-toggle dropdown-toggle-split"
						data-bs-toggle="dropdown"> <span class="visually-hidden">Toggle Dropdown</span>
					</button>
					<div class="dropdown-menu dropdown-menu-right dropdown-menu-lg-end"> <a class="dropdown-item"
							href="javascript:;">Action</a>
						<a class="dropdown-item" href="javascript:;">Another action</a>
						<a class="dropdown-item" href="javascript:;">Something else here</a>
						<div class="dropdown-divider"></div> <a class="dropdown-item" href="javascript:;">Separated
							link</a>
					</div>
				</div>
			</div>
		</div>
		<!--end breadcrumb-->

		<div class="row">
			<div class="col-xl-6 mx-auto">
				<div class="card">
					<div class="card-header px-4 py-3">
						<h5 class="mb-0">Address Validation</h5>
					</div>
					<div class="card-body p-4">
						<form method="post" class="row g-3 needs-validation" data-parsley-validate>
							{% csrf_token %}

							<div class="col-md-12">
								<label for="bsValidation13" class="form-label">Address</label>
								<textarea class="form-control" id="bsValidation13" placeholder="Address ..." rows="3"
									name="area_address" required data-parsley-required-message="Address is required"></textarea>
								<div class="invalid-feedback">
									Please enter a valid address.
								</div>
							</div>
							<div class="col-md-2">
								<label for="bsValidation12" class="form-label">Zip</label>
								<input type="text" class="form-control" id="bsValidation12" placeholder="Zip"
									name="area_pincode" required data-parsley-type="number" required data-parsley-required-message="number is required">
								<div class="invalid-feedback">
									Please enter a valid Zip code.
								</div>
							</div>
							<div class="col-md-12">
								<div class="d-md-flex d-grid align-items-center gap-3">
									<button type="submit" class="btn btn-primary px-4">Submit</button>
									<button type="reset" class="btn btn-light px-4">Reset</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<!--end row-->


	</div>
</div>
<!--end page wrapper -->
{% endblock %}
